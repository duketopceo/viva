[workspace]
resolver = "2"
members = [
    "crates/viva-db",
    "crates/viva-core",
    "crates/viva-index",
    "crates/viva",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
axum = "0.8"

viva-db = { path = "crates/viva-db" }
viva-core = { path = "crates/viva-core" }
viva-index = { path = "crates/viva-index" }
